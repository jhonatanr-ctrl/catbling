<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Juego de Memoria</title>
  <link rel="stylesheet" href="../../resources/stylesheetglobal.css">
  <link rel="stylesheet" href="../../resources/help.css">
  <link rel="stylesheet" href="../../resources/tutorial.css">
  <link rel="stylesheet" href="./resources/style.css">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&display=swap" rel="stylesheet">
  <link href="https://fonts.googleapis.com/css2?family=Pixelify+Sans:wght@400..700&display=swap" rel="stylesheet">
</head>
<body>

  <video class="video-bg" autoplay muted loop playsinline>
    <source src="./resources/assets/Small Orange Bokeh Blurred Effect - Free Effects Background Video (1).mp4" type="video/mp4">
  </video>

  <div class="menu-buttons-container">
    <a href="../juegosprincipalpage.html" class="menu-button">
      <img id="menu-img" src="../../juegos/assets/salida1.png">
    </a>
  </div>

  <div class="monedas-ui">
    <img id="icono-monedasm"
         src="../../resources/assets/yukonocoins.png"
         data-src-vacio="../../resources/assets/yukonocoins.png"
         data-src-lleno="../../resources/assets/yukocoins.png">
    <p id="cantidad-monedasm">0</p>
  </div>

  <img src="../../resources/assets/settings.png" id="btn-opciones">
  <div id="overlay-menu"></div>

  <div id="bag-overlay">
    <div id="bag-content">
      <div id="bag-items-container"></div>
    </div>
  </div>
  <div id="item-use-overlay">
    <div id="item-use-content"></div>
  </div>

  <div id="menu-opciones">
    <div class="menu-box">
      <h2 data-i18n="opciones">OPCIONES</h2>
      <div class="menu-scroll">
      <div class="opcion-item">
        <span data-i18n="musica">Música</span>
        <div class="grupo-botones">
          <button onclick="cambiarVolumen(-1)">-</button>
          <span id="vol-musica"></span>
          <button onclick="cambiarVolumen(1)">+</button>
        </div>
      </div>
      <div class="opcion-item">
        <span data-i18n="efectos">Efectos</span>
        <div class="grupo-botones">
          <button onclick="cambiarEfectos(-1)">-</button>
          <span id="vol-efectos"></span>
          <button onclick="cambiarEfectos(1)">+</button>
        </div>
      </div>
      <div class="opcion-item">
        <span data-i18n="animaciones">Animaciones</span>
        <div class="grupo-botones">
          <button onclick="toggleAnimaciones()" id="animaciones-btn"></button>
        </div>
      </div>
      <div class="opcion-item">
        <span data-i18n="idioma">Idioma</span>
        <div class="grupo-botones">
          <button onclick="setIdioma('es')">ES</button>
          <button onclick="setIdioma('en')">EN</button>
        </div>
      </div>
      <div class="opcion-item">
        <span data-i18n="config">Configuración</span>
        <div class="grupo-botones">
          <button onclick="resetear()">RESET</button>
        </div>
      </div>
      <div class="opcion-item" id="opcion-cerrar-sesion">
        <span data-i18n="cerrar_sesion">Cerrar Sesión</span>
        <div class="grupo-botones">
          <button onclick="mostrarConfirmacionCerrarSesion()">SALIR</button>
        </div>
      </div>
      </div>
      <img src="../../resources/assets/exit.png" id="cerrar-menu">
    </div>
  </div>

  <div id="mainContent">
    <div class="win-overlay" id="win-overlay">
      <div class="win-lights" id="win-lights"></div>
      <div class="win-content">
        <h2 class="win-text" id="win-text" data-i18n="ganaste">¡GANASTE!</h2>
        <p class="win-amount" id="win-amount">+0</p>
      </div>
    </div>

    <div class="lose-overlay" id="lose-overlay">
      <div class="lose-lights"></div>
      <div class="lose-content">
        <h2 class="lose-text" id="lose-text" data-i18n="perdiste">¡PERDISTE!</h2>
      </div>
    </div>

    <audio id="bgMusic" autoplay loop>
      <source src="./resources/assets/soundtrack/16-Bit Music  - We Must Battle NOW!.mp3" type="audio/mpeg">
      Tu navegador no soporta audio.
    </audio>

    <header class="titulo-principal fade-el item1">
      <h1 class="h1" data-i18n="memoria_tit">¡MEMORIA Y PARES!</h1>
      <p class="instruccion" id="instruccion-text">¡Encuentra todos los pares!</p>
    </header>

    <div class="top-bar fade-el item1">
      <div id="infomovimientos">
        <span data-i18n="movimientos"></span> <span id="moves">0</span>
      </div>
      <button id="restart-button">
        <span class="restart-text" data-i18n="jugar">JUGAR</span>
      </button>
    </div>

    <div class="apuesta-container">
      <p class="apuesta-text" data-i18n="apuesta">Apuesta: <span id="apuesta-actual">20</span> monedas</p>
      <div class="apuesta-slider-wrapper">
        <span class="apuesta-min">7</span>
        <input type="number" class="bet-input" id="bet-input" value="20" min="7" max="500" step="1" inputmode="numeric">
        <span class="apuesta-max">500</span>
      </div>
    </div>

    <div class="niveles-panel">
      <h3 class="niveles-titulo" data-i18n="niveles">NIVELES</h3>
      <div class="niveles-lista" id="niveles-lista"></div>
    </div>

    <div id="game-board" class="game-board fade-el item1"></div>
  </div>

  <div id="tutorial-overlay" class="tutorial-overlay">
    <div class="tutorial-container">
      <div class="tutorial-character-wrapper">
        <div class="tutorial-character" id="tutorial-character">
          <img src="../../resources/assets/3.png" alt="Personaje" id="tutorial-img">
        </div>
      </div>
      <div class="tutorial-speech">
        <div class="speech-arrow"></div>
        <div class="speech-bubble">
          <p id="tutorial-text"></p>
        </div>
        <div class="speech-footer">
          <span id="tutorial-step" class="tutorial-step">1/5</span>
          <div class="speech-buttons">
            <button id="tutorial-skip" class="speech-btn speech-btn-skip">SALTAR</button>
            <button id="tutorial-next" class="speech-btn speech-btn-next">SIGUIENTE</button>
          </div>
        </div>
      </div>
    </div>
  </div>
  <script src="../../resources/help.js"></script>
  <script src="../../resources/api.js"></script>
  <script src="../../resources/guest.js?v=2"></script>
  <script src="../../resources/coins.js"></script>
  <script src="../../resources/tutorial.js"></script>
<script src="./resources/script.js"></script>
  <script src="../../resources/config.js?v=2"></script>

    <!-- ⚠️ CONFIRMACIÓN CERRAR SESIÓN -->
    <div id="confirmacion-cerrar-sesion">
        <div class="confirmacion-contenido">
            <h2 class="confirmacion-titulo">¿CERRAR SESIÓN?</h2>
            <p class="confirmacion-texto">Toda su información será eliminada, ¿desea continuar?</p>
            <div class="confirmacion-botones">
                <button id="btn-confirmar-si" class="confirmacion-btn confirmacion-btn-si">SÍ</button>
                <button id="btn-confirmar-no" class="confirmacion-btn confirmacion-btn-no">NO</button>
            </div>
        </div>
    </div>

</body>
</html>
